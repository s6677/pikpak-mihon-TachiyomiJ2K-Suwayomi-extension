name: Publish PikPak Cloud Simple

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Checkout Keiyoushi build system
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: keiyoushi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install PikPak Cloud v0.10 source
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 -d > /tmp/pikpak-source.zip
          rm -rf /tmp/pikpak-source
          mkdir -p /tmp/pikpak-source
          unzip -q /tmp/pikpak-source.zip -d /tmp/pikpak-source

          rm -rf keiyoushi/src/all/pikpakcloud
          cp -R /tmp/pikpak-source/src/all/pikpakcloud keiyoushi/src/all/pikpakcloud

          mkdir -p src/all
          rm -rf src/all/pikpakcloud
          cp -R /tmp/pikpak-source/src/all/pikpakcloud src/all/pikpakcloud

      - name: Format source
        working-directory: keiyoushi
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew src:all:pikpakcloud:spotlessApply

      - name: Copy formatted source back
        shell: bash
        run: |
          rm -rf src/all/pikpakcloud
          cp -R keiyoushi/src/all/pikpakcloud src/all/pikpakcloud

      - name: Create throwaway release signing key
        working-directory: keiyoushi
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair             -alias pikpakcloud             -keyalg RSA             -keysize 2048             -validity 3650             -keystore signingkey.jks             -storepass pikpakcloud             -keypass pikpakcloud             -dname "CN=PikPak Cloud Extension, O=Community, C=KR"

          FINGERPRINT="$(keytool -list -v             -keystore signingkey.jks             -storepass pikpakcloud             -alias pikpakcloud             -keypass pikpakcloud             | grep "SHA256:" | head -1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          echo "SIGNING_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build release APK and Suwayomi JAR
        working-directory: keiyoushi
        shell: bash
        env:
          ALIAS: pikpakcloud
          KEY_STORE_PASSWORD: pikpakcloud
          KEY_PASSWORD: pikpakcloud
        run: |
          set +e
          ./gradlew src:all:pikpakcloud:assembleRelease --stacktrace 2>&1 | tee /tmp/pikpak-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo
            echo "================ SHORT ERROR SUMMARY ================"
            grep -En "(^e: |error: |Unresolved reference|Cannot access|Suspend function|Type mismatch|No value passed|overrides nothing|None of the following|Too many arguments|Not enough information|Compilation error)" /tmp/pikpak-build.log | head -n 120 || true
            echo "====================================================="
            exit "$status"
          fi

      - name: Collect APK and JAR
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find keiyoushi/src/all/pikpakcloud/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          JAR="$(find keiyoushi/src/all/pikpakcloud/build/outputs/jar/release -type f -name '*.jar' -print -quit)"
          INFO="keiyoushi/src/all/pikpakcloud/build/keiyoushi-source-info.json"

          echo "APK: $APK"
          echo "JAR: $JAR"

          test -n "$APK"
          test -n "$JAR"
          test -f "$INFO"

          rm -rf apk jar icon
          mkdir -p apk jar icon

          cp "$APK" apk/PikPak-Cloud.apk
          cp "$JAR" jar/PikPak-Cloud.jar
          cp src/all/pikpakcloud/res/mipmap-xhdpi/ic_launcher.png icon/pikpakcloud.png
          cp "$INFO" /tmp/keiyoushi-source-info.json

          ls -lh apk/PikPak-Cloud.apk jar/PikPak-Cloud.jar

      - name: Generate Extension Store files
        shell: bash
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check protobuf grpcio-tools

          cat > /tmp/index.proto <<'PROTO'
          syntax = "proto3";

          message Index {
            string name = 1;
            string badgeLabel = 2;
            string signingKey = 3;
            Contact contact = 4;
            oneof extensions {
              ExtensionList extensionList = 101;
              string extensionListUrl = 102;
            }
          }

          message Contact {
            string website = 1;
            optional string discord = 2;
          }

          message ExtensionList {
            repeated Extension extensions = 1;
          }

          message Extension {
            string name = 1;
            string packageName = 2;
            Resources resources = 3;
            string extensionLib = 4;
            int64 versionCode = 5;
            string versionName = 6;
            ContentWarning contentWarning = 7;
            repeated Source sources = 8;
          }

          message Resources {
            string apkUrl = 1;
            string iconUrl = 2;
            string jarUrl = 501;
          }

          message Source {
            int64 id = 1;
            string name = 2;
            string language = 3;
            string homeUrl = 4;
            repeated string mirrorUrls = 5;
            optional string message = 7;
          }

          enum ContentWarning {
            CONTENT_WARNING_UNSPECIFIED = 0;
            CONTENT_WARNING_SAFE = 1;
            CONTENT_WARNING_MIXED = 2;
            CONTENT_WARNING_NSFW = 3;
          }
          PROTO

          python -m grpc_tools.protoc --proto_path=/tmp --python_out=/tmp /tmp/index.proto

          python <<'PY'
          import gzip
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "/tmp")
          import index_pb2
          from google.protobuf import json_format

          repo = os.environ["REPO_SLUG"]
          fingerprint = os.environ["SIGNING_FINGERPRINT"].strip().lower()
          info = json.loads(Path("/tmp/keiyoushi-source-info.json").read_text(encoding="utf-8"))
          base = f"https://raw.githubusercontent.com/{repo}/main"

          cw = info.get("contentWarning", 1)
          if isinstance(cw, str):
              cw = {
                  "SAFE": 1,
                  "MIXED": 2,
                  "NSFW": 3,
                  "CONTENT_WARNING_SAFE": 1,
                  "CONTENT_WARNING_MIXED": 2,
                  "CONTENT_WARNING_NSFW": 3,
              }.get(cw.upper(), 1)

          ext = index_pb2.Extension(
              name=info["name"],
              packageName=info["packageName"],
              resources=index_pb2.Resources(
                  apkUrl=f"{base}/apk/PikPak-Cloud.apk",
                  iconUrl=f"{base}/icon/pikpakcloud.png",
                  jarUrl=f"{base}/jar/PikPak-Cloud.jar",
              ),
              extensionLib=info["extensionLib"],
              versionCode=int(info["versionCode"]),
              versionName=info["versionName"],
              contentWarning=int(cw),
              sources=[
                  index_pb2.Source(
                      id=int(source["id"]),
                      name=source["name"],
                      language=source["lang"],
                      homeUrl=source["baseUrl"],
                      mirrorUrls=source.get("mirrorUrls", []),
                  )
                  for source in info["sources"]
              ],
          )

          index = index_pb2.Index(
              name="PikPak Cloud",
              badgeLabel="PIKPAK",
              signingKey=fingerprint,
              contact=index_pb2.Contact(
                  website=f"https://github.com/{repo}",
              ),
              extensionList=index_pb2.ExtensionList(extensions=[ext]),
          )

          Path("index.pb").write_bytes(
              gzip.compress(index.SerializeToString(deterministic=True), mtime=0)
          )
          Path("index.json").write_text(
              json_format.MessageToJson(index, preserving_proto_field_name=True),
              encoding="utf-8",
          )
          Path("repo.json").write_text(
              json.dumps(
                  {
                      "index_v2": f"{base}/index.pb",
                      "meta": {
                          "name": "PikPak Cloud",
                          "website": f"https://github.com/{repo}",
                      },
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Write bilingual README
        shell: bash
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          cat > README.md <<EOF
          # PikPak Cloud for Mihon / TachiyomiJ2K / Suwayomi

          把你自己的 PikPak 云盘变成 Mihon / TachiyomiJ2K / Suwayomi 的私人漫画源。  
          Turn your own PikPak storage into a private manga source for Mihon, TachiyomiJ2K, and Suwayomi.

          **本项目不提供漫画、不共享 PikPak 账号，也不包含任何用户凭证。**  
          **This project does not provide manga, shared PikPak accounts, or user credentials.**

          ## 扩展仓库地址 / Extension Store URL

          \`\`\`
          https://raw.githubusercontent.com/$REPO_SLUG/main/index.pb
          \`\`\`

          Android: add this URL to Mihon / TachiyomiJ2K Extension Stores.  
          PC: add the same URL to a compatible Suwayomi Extension Store.

          ## 使用前准备 / Before use

          1. 打开 PikPak，进入 **设置 → 访问与集成 → WebDAV**。  
             In PikPak, open **Settings → Access & Integrations → WebDAV**.
          2. 启用 WebDAV，并创建一组 WebDAV 凭证。  
             Enable WebDAV and create WebDAV credentials.
          3. PikPak 会显示服务器地址、WebDAV 用户名和 WebDAV 密码。请不要把这些凭证分享给别人。  
             PikPak will show the server URL, WebDAV username, and WebDAV password. Keep them private.
          4. 在 PikPak Cloud 来源设置里填入这些信息，再填写漫画根目录。  
             Enter those values in PikPak Cloud source settings, then set your manga root folder.

          PikPak 官方目前说明 WebDAV 面向 Premium 用户。  
          PikPak currently documents WebDAV as a Premium feature.

          ## 四个设置项 / The four settings

          **WebDAV 地址 / WebDAV URL**  
          通常保持默认 \`https://dav.pikpak.ai/\`。  
          Usually keep the default \`https://dav.pikpak.ai/\`.

          **WebDAV 用户名 / WebDAV Username**  
          填 PikPak WebDAV 页面显示的用户名，不是登录邮箱或手机号。  
          Use the username shown on the PikPak WebDAV page, not your login email or phone number.

          **WebDAV 密码 / WebDAV Password**  
          填 WebDAV 页面生成的密码，不是 PikPak 账号登录密码。  
          Use the WebDAV-generated password, not your PikPak account password.

          **漫画根目录 / Manga Root Folder**  
          这是 PikPak 里存放漫画 ZIP/CBZ 的文件夹路径，例如 \`/漫画/\`。  
          This is the PikPak folder containing your manga ZIP/CBZ files, for example \`/漫画/\`.

          插件只列出这个目录第一层的 ZIP/CBZ，每个压缩包作为一本漫画。填 \`/\` 可以扫描 PikPak 根目录第一层。  
          The extension lists ZIP/CBZ files directly inside this folder. Each archive becomes one manga. Use \`/\` to scan the first level of the PikPak root.

          ## 压缩包结构 / Archive structure

          Example:

          \`\`\`
          /漫画/
            火之鸟.zip
              火之鸟/
                Vol.01/
                  001.jpg
                  002.jpg
                Vol.02/
                  001.jpg
          \`\`\`

          ZIP/CBZ pages are read remotely with HTTP Range access. The whole archive does not need to be downloaded before reading.

          ## 更新 / Updating

          为了保持这个项目简单，本仓库不维护固定 APK 签名。以后如果新版不能覆盖旧版，请卸载旧扩展后重新安装。  
          To keep the project simple, this repository does not maintain a permanent APK signing key. If a future build cannot replace an old one, uninstall the old extension and install the new build.

          ## Privacy / 隐私

          WebDAV credentials stay in each user's own extension settings. Never publish or share them.

          ## Disclaimer

          Independent community project. Not affiliated with PikPak, Mihon, TachiyomiJ2K, Suwayomi, or Keiyoushi.
          EOF

      - name: Remove throwaway signing key
        if: always()
        run: rm -f keiyoushi/signingkey.jks

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md src apk jar icon index.pb index.json repo.json

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Publish PikPak Cloud v0.10"
          git push
