name: Publish PikPak Cloud Simple

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Checkout Keiyoushi build system
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: keiyoushi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install PikPak Cloud v0.15 source
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 -d > /tmp/pikpak-source.zip
          rm -rf /tmp/pikpak-source
          mkdir -p /tmp/pikpak-source
          unzip -q /tmp/pikpak-source.zip -d /tmp/pikpak-source

          rm -rf keiyoushi/src/all/pikpakcloud
          cp -R /tmp/pikpak-source/src/all/pikpakcloud keiyoushi/src/all/pikpakcloud

          mkdir -p src/all
          rm -rf src/all/pikpakcloud
          cp -R /tmp/pikpak-source/src/all/pikpakcloud src/all/pikpakcloud

      - name: Format source
        working-directory: keiyoushi
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew src:all:pikpakcloud:spotlessApply

      - name: Copy formatted source back
        shell: bash
        run: |
          rm -rf src/all/pikpakcloud
          cp -R keiyoushi/src/all/pikpakcloud src/all/pikpakcloud

      - name: Create throwaway release signing key
        working-directory: keiyoushi
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair             -alias pikpakcloud             -keyalg RSA             -keysize 2048             -validity 3650             -keystore signingkey.jks             -storepass pikpakcloud             -keypass pikpakcloud             -dname "CN=PikPak Cloud Extension, O=Community, C=KR"

          FINGERPRINT="$(keytool -list -v             -keystore signingkey.jks             -storepass pikpakcloud             -alias pikpakcloud             -keypass pikpakcloud             | grep "SHA256:" | head -1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          echo "SIGNING_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build release APK and Suwayomi JAR
        working-directory: keiyoushi
        shell: bash
        env:
          ALIAS: pikpakcloud
          KEY_STORE_PASSWORD: pikpakcloud
          KEY_PASSWORD: pikpakcloud
        run: |
          set +e
          ./gradlew src:all:pikpakcloud:assembleRelease --stacktrace 2>&1 | tee /tmp/pikpak-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo
            echo "================ SHORT ERROR SUMMARY ================"
            grep -En "(^e: |error: |Unresolved reference|Cannot access|Suspend function|Type mismatch|No value passed|overrides nothing|None of the following|Too many arguments|Not enough information|Compilation error)" /tmp/pikpak-build.log | head -n 160 || true
            echo "====================================================="
            exit "$status"
          fi

      - name: Collect APK and JAR
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find keiyoushi/src/all/pikpakcloud/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          JAR="$(find keiyoushi/src/all/pikpakcloud/build/outputs/jar/release -type f -name '*.jar' -print -quit)"
          INFO="keiyoushi/src/all/pikpakcloud/build/keiyoushi-source-info.json"

          echo "APK: $APK"
          echo "JAR: $JAR"

          test -n "$APK"
          test -n "$JAR"
          test -f "$INFO"

          rm -rf apk jar icon
          mkdir -p apk jar icon

          cp "$APK" apk/PikPak-Cloud.apk
          cp "$JAR" jar/PikPak-Cloud.jar
          cp src/all/pikpakcloud/res/mipmap-xhdpi/ic_launcher.png icon/pikpakcloud.png
          cp "$INFO" /tmp/keiyoushi-source-info.json

          ls -lh apk/PikPak-Cloud.apk jar/PikPak-Cloud.jar

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION_CODE="$(python - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path("/tmp/keiyoushi-source-info.json").read_text(encoding="utf-8"))
          print(int(info["versionCode"]))
          PY
          )"
          TAG="v0.${VERSION_CODE}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          NOTES="PikPak Cloud v0.15. Fix image-folder chapter loading by using the WebDAV href as the canonical child path instead of rebuilding paths from displayName. Adds requested path/url to WebDAV HTTP errors for diagnosis. ZIP/CBZ behavior is unchanged. Default library folder: /Comics/."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping existing assets so download counts are preserved."

            EXISTING="$(gh release view "$TAG" --json assets --jq '.assets[].name')"

            if ! printf '%s\n' "$EXISTING" | grep -Fxq "PikPak-Cloud.apk"; then
              gh release upload "$TAG" apk/PikPak-Cloud.apk
            fi

            if ! printf '%s\n' "$EXISTING" | grep -Fxq "PikPak-Cloud.jar"; then
              gh release upload "$TAG" jar/PikPak-Cloud.jar
            fi

            gh release edit "$TAG" \
              --title "PikPak Cloud $TAG" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG" \
              apk/PikPak-Cloud.apk \
              jar/PikPak-Cloud.jar \
              --title "PikPak Cloud $TAG" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Generate Extension Store files
        shell: bash
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check protobuf grpcio-tools

          cat > /tmp/index.proto <<'PROTO'
          syntax = "proto3";

          message Index {
            string name = 1;
            string badgeLabel = 2;
            string signingKey = 3;
            Contact contact = 4;
            oneof extensions {
              ExtensionList extensionList = 101;
              string extensionListUrl = 102;
            }
          }

          message Contact {
            string website = 1;
            optional string discord = 2;
          }

          message ExtensionList {
            repeated Extension extensions = 1;
          }

          message Extension {
            string name = 1;
            string packageName = 2;
            Resources resources = 3;
            string extensionLib = 4;
            int64 versionCode = 5;
            string versionName = 6;
            ContentWarning contentWarning = 7;
            repeated Source sources = 8;
          }

          message Resources {
            string apkUrl = 1;
            string iconUrl = 2;
            string jarUrl = 501;
          }

          message Source {
            int64 id = 1;
            string name = 2;
            string language = 3;
            string homeUrl = 4;
            repeated string mirrorUrls = 5;
            optional string message = 7;
          }

          enum ContentWarning {
            CONTENT_WARNING_UNSPECIFIED = 0;
            CONTENT_WARNING_SAFE = 1;
            CONTENT_WARNING_MIXED = 2;
            CONTENT_WARNING_NSFW = 3;
          }
          PROTO

          python -m grpc_tools.protoc --proto_path=/tmp --python_out=/tmp /tmp/index.proto

          python <<'PY'
          import gzip
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "/tmp")
          import index_pb2
          from google.protobuf import json_format

          repo = os.environ["REPO_SLUG"]
          fingerprint = os.environ["SIGNING_FINGERPRINT"].strip().lower()
          info = json.loads(Path("/tmp/keiyoushi-source-info.json").read_text(encoding="utf-8"))
          base = f"https://raw.githubusercontent.com/{repo}/main"
          release_tag = os.environ["RELEASE_TAG"]
          release_base = f"https://github.com/{repo}/releases/download/{release_tag}"

          cw = info.get("contentWarning", 1)
          if isinstance(cw, str):
              cw = {
                  "SAFE": 1,
                  "MIXED": 2,
                  "NSFW": 3,
                  "CONTENT_WARNING_SAFE": 1,
                  "CONTENT_WARNING_MIXED": 2,
                  "CONTENT_WARNING_NSFW": 3,
              }.get(cw.upper(), 1)

          ext = index_pb2.Extension(
              name=info["name"],
              packageName=info["packageName"],
              resources=index_pb2.Resources(
                  apkUrl=f"{release_base}/PikPak-Cloud.apk",
                  iconUrl=f"{base}/icon/pikpakcloud.png",
                  jarUrl=f"{release_base}/PikPak-Cloud.jar",
              ),
              extensionLib=info["extensionLib"],
              versionCode=int(info["versionCode"]),
              versionName=info["versionName"],
              contentWarning=int(cw),
              sources=[
                  index_pb2.Source(
                      id=int(source["id"]),
                      name=source["name"],
                      language=source["lang"],
                      homeUrl=source["baseUrl"],
                      mirrorUrls=source.get("mirrorUrls", []),
                  )
                  for source in info["sources"]
              ],
          )

          index = index_pb2.Index(
              name="PikPak Cloud",
              badgeLabel="PIKPAK",
              signingKey=fingerprint,
              contact=index_pb2.Contact(
                  website=f"https://github.com/{repo}",
              ),
              extensionList=index_pb2.ExtensionList(extensions=[ext]),
          )

          Path("index.pb").write_bytes(
              gzip.compress(index.SerializeToString(deterministic=True), mtime=0)
          )
          Path("index.json").write_text(
              json_format.MessageToJson(index, preserving_proto_field_name=True),
              encoding="utf-8",
          )
          Path("repo.json").write_text(
              json.dumps(
                  {
                      "index_v2": f"{base}/index.pb",
                      "meta": {
                          "name": "PikPak Cloud",
                          "website": f"https://github.com/{repo}",
                      },
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove throwaway signing key
        if: always()
        run: rm -f keiyoushi/signingkey.jks

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src apk jar icon index.pb index.json repo.json

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Publish PikPak Cloud v0.15"
          git push
