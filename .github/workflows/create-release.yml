name: Create Download Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check published files
        shell: bash
        run: |
          set -euo pipefail
          test -f apk/PikPak-Cloud.apk
          test -f jar/PikPak-Cloud.jar
          ls -lh apk/PikPak-Cloud.apk jar/PikPak-Cloud.jar

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v0.12"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              apk/PikPak-Cloud.apk \
              jar/PikPak-Cloud.jar \
              --clobber

            gh release edit "$TAG" \
              --title "PikPak Cloud v0.12" \
              --notes "PikPak Cloud for Mihon / TachiyomiJ2K / Suwayomi. Default library folder is now /Comics/. Users can still choose any other PikPak folder." \
              --latest
          else
            gh release create "$TAG" \
              apk/PikPak-Cloud.apk \
              jar/PikPak-Cloud.jar \
              --title "PikPak Cloud v0.12" \
              --notes "PikPak Cloud for Mihon / TachiyomiJ2K / Suwayomi. Default library folder is now /Comics/. Users can still choose any other PikPak folder." \
              --latest
          fi
