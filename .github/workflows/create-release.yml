name: Create Download Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check published files
        shell: bash
        run: |
          set -euo pipefail
          test -f apk/PikPak-Cloud.apk
          test -f jar/PikPak-Cloud.jar
          ls -lh apk/PikPak-Cloud.apk jar/PikPak-Cloud.jar

      - name: Add easy download links to README
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          from pathlib import Path
          import os

          repo = os.environ["REPO"]
          readme = Path("README.md")
          old = readme.read_text(encoding="utf-8") if readme.exists() else ""

          start = "<!-- EASY-INSTALL-START -->"
          end = "<!-- EASY-INSTALL-END -->"

          block = f"""\
          {start}
          ## 🚀 安装 / Install

          ### 方法一：添加扩展仓库网址 / Option 1: Extension Store URL

          把下面这个网址添加到 Mihon、TachiyomiJ2K 或兼容版本的 Suwayomi：

          Add this URL to Mihon, TachiyomiJ2K, or a compatible Suwayomi Extension Store:

          ```text
          https://raw.githubusercontent.com/{repo}/main/index.pb
          ```

          ### 方法二：直接下载 / Option 2: Manual Download

          **Android · Mihon / TachiyomiJ2K**

          [⬇️ 下载 PikPak-Cloud.apk / Download APK](https://github.com/{repo}/releases/latest/download/PikPak-Cloud.apk)

          **PC · Suwayomi**

          [⬇️ 下载 PikPak-Cloud.jar / Download JAR](https://github.com/{repo}/releases/latest/download/PikPak-Cloud.jar)

          两种方式功能相同，用户自己选择即可。  
          Both installation methods provide the same extension. Choose whichever you prefer.

          {end}
          """

          if start in old and end in old:
              before = old.split(start, 1)[0]
              after = old.split(end, 1)[1]
              new = before + block + after.lstrip("\n")
          else:
              lines = old.splitlines()
              if lines and lines[0].startswith("# "):
                  new = lines[0] + "\n\n" + block + "\n" + "\n".join(lines[1:]).lstrip("\n")
              else:
                  new = block + "\n" + old

          readme.write_text(new, encoding="utf-8")
          PY

      - name: Commit README links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Add easy install and download links"
            git push
          fi

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v0.11"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              apk/PikPak-Cloud.apk \
              jar/PikPak-Cloud.jar \
              --clobber
            gh release edit "$TAG" \
              --title "PikPak Cloud v0.11" \
              --notes "PikPak Cloud for Mihon / TachiyomiJ2K / Suwayomi. Users can either add the Extension Store URL or download the APK/JAR manually." \
              --latest
          else
            gh release create "$TAG" \
              apk/PikPak-Cloud.apk \
              jar/PikPak-Cloud.jar \
              --title "PikPak Cloud v0.11" \
              --notes "PikPak Cloud for Mihon / TachiyomiJ2K / Suwayomi. Users can either add the Extension Store URL or download the APK/JAR manually." \
              --latest
          fi
